name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: on_the_way_ci
          POSTGRES_USER: otw_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otw_ci -d on_the_way_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate database migrations
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -h localhost -U otw_ci -d on_the_way_ci -v ON_ERROR_STOP=1 -f database/migrations/001_initial_mobility_schema.sql
          psql -h localhost -U otw_ci -d on_the_way_ci -v ON_ERROR_STOP=1 -f database/migrations/002_multi_role_and_driver_application.sql
          psql -h localhost -U otw_ci -d on_the_way_ci -v ON_ERROR_STOP=1 -f database/migrations/003_booking_idempotency.sql
          psql -h localhost -U otw_ci -d on_the_way_ci -v ON_ERROR_STOP=1 -f database/migrations/004_booking_event_history.sql
          psql -h localhost -U otw_ci -d on_the_way_ci -v ON_ERROR_STOP=1 -f database/migrations/005_driver_application_event_history.sql
          psql -h localhost -U otw_ci -d on_the_way_ci -v ON_ERROR_STOP=1 -f database/migrations/006_operator_driver_review.sql
          psql -h localhost -U otw_ci -d on_the_way_ci -v ON_ERROR_STOP=1 -f database/migrations/007_driver_availability_gate.sql
          psql -h localhost -U otw_ci -d on_the_way_ci -v ON_ERROR_STOP=1 -f database/migrations/008_vehicle_onboarding_review.sql
          psql -h localhost -U otw_ci -d on_the_way_ci -v ON_ERROR_STOP=1 -f database/migrations/009_service_zone_administration.sql
      - run: npm run typecheck
      - run: npm run build
