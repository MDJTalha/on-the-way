<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17231f">
  <title>On the Way — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fbfcfa;color:#17231f;font:16px Arial,sans-serif}
    main{max-width:420px;text-align:center;background:#fff;border:1px solid #e7ebe7;border-radius:18px;padding:38px;box-shadow:0 18px 55px #1a2b1f0b}
    .mark{display:grid;place-items:center;margin:0 auto 22px;width:52px;height:52px;border-radius:15px;background:#17231f;color:#a8d62b;font-weight:800;font-size:22px}
    h1{font-size:24px;margin:0 0 12px}p{color:#78827d;line-height:1.6;font-size:14px}a{display:inline-block;margin-top:14px;background:#a8d62b;color:#17231f;text-decoration:none;padding:12px 18px;border-radius:8px;font-weight:700;font-size:13px}
  </style>
</head>
<body><main><div class="mark">OW</div><h1>You’re offline</h1><p>On the Way needs a connection to verify your Pi identity, search places and submit ride requests. Reconnect and try again. No ride has been booked.</p><a href="/">Try again</a></main></body>
</html>
